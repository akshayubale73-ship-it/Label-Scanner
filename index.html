<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fortify Health Premix Batch Scanner: record premix batches available at mills.">
<meta name="theme-color" content="#dc6059">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Premix Scanner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Premix Batch Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Layout: one narrow app column (phone first). Scanner card dominates home; focused flows hide the tab bar and pin their action to the bottom. */
:root{
  --coral:#dc6059; --coral-strong:#c2544e; --coral-soft:rgba(220,96,89,.10); --coral-border:rgba(220,96,89,.28);
  --slate:#474f54; --mint:#bfe0d3; --mint-deep:#47816b;
  --bg:#f6f5f3; --card:#ffffff; --fg:#1c1917; --fg-2:#44403c; --muted:#f1efed; --muted-fg:#6f6862;
  --border:#e7e5e4; --border-strong:#d6d3d1; --field-locked:#f7f6f4;
  --ok:#16a34a; --ok-bg:#dcfce7; --ok-fg:#166534; --ok-bd:#bbf7d0;
  --warn:#f59e0b; --warn-bg:#fef3c7; --warn-fg:#92400e; --warn-bd:#fde68a;
  --err:#dc2626; --err-bg:#fee2e2; --err-fg:#991b1b; --err-bd:#fecaca;
  --pend-bg:#f1efed; --pend-fg:#6f6862;
  --on-coral:#ffffff; --shadow:0 1px 2px rgba(28,25,23,.05); --sheet-shadow:0 -10px 30px -5px rgba(0,0,0,.18);
  --scrim:rgba(28,25,23,.45);
  --scan-bg:#0f0e0d; --scan-fg:#fafaf9; --scan-dim:rgba(255,255,255,.66);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:8px; --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --coral:#e3706a; --coral-strong:#dc6059; --coral-soft:rgba(227,112,106,.15); --coral-border:rgba(227,112,106,.35);
  --bg:#141211; --card:#1e1b19; --fg:#f5f4f3; --fg-2:#d6d3d1; --muted:#2a2623; --muted-fg:#a8a29e;
  --border:#34302c; --border-strong:#48423d; --field-locked:#24211e;
  --ok-bg:rgba(22,163,74,.18); --ok-fg:#86efac; --ok-bd:rgba(22,163,74,.4);
  --warn-bg:rgba(245,158,11,.16); --warn-fg:#fcd34d; --warn-bd:rgba(245,158,11,.4);
  --err-bg:rgba(220,38,38,.18); --err-fg:#fca5a5; --err-bd:rgba(220,38,38,.45);
  --pend-bg:#2a2623; --pend-fg:#a8a29e; --on-coral:#1a0c0b; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --coral:#e3706a; --coral-strong:#dc6059; --coral-soft:rgba(227,112,106,.15); --coral-border:rgba(227,112,106,.35);
  --bg:#141211; --card:#1e1b19; --fg:#f5f4f3; --fg-2:#d6d3d1; --muted:#2a2623; --muted-fg:#a8a29e;
  --border:#34302c; --border-strong:#48423d; --field-locked:#24211e;
  --ok-bg:rgba(22,163,74,.18); --ok-fg:#86efac; --ok-bd:rgba(22,163,74,.4);
  --warn-bg:rgba(245,158,11,.16); --warn-fg:#fcd34d; --warn-bd:rgba(245,158,11,.4);
  --err-bg:rgba(220,38,38,.18); --err-fg:#fca5a5; --err-bd:rgba(220,38,38,.45);
  --pend-bg:#2a2623; --pend-fg:#a8a29e; --on-coral:#1a0c0b; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral-border);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hdr .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:34px;height:34px}
.brand{flex:1;min-width:0;line-height:1.2}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:14px;color:var(--muted-fg)}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.net .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.net.off{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;flex:none;position:relative}
.iconbtn .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--on-coral);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.offbar{background:var(--warn-bg);color:var(--warn-fg);border-bottom:1px solid var(--warn-bd);font-size:15px}
.offbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.offbar b{font-weight:700}

main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
main.focus{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.page{display:flex;flex-direction:column;gap:20px;padding-block:20px}
.intro h1{font-size:26px;font-weight:700;line-height:1.2}
.intro p{color:var(--muted-fg);margin-top:6px;max-width:40ch}
.mill-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-2);margin-top:10px}
.mill-line b{font-weight:600}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h a,.link{color:var(--coral-strong);font-weight:600;font-size:15px;background:none;border:0;padding:6px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec-h a,:root:not([data-theme="light"]) .link{color:var(--coral)}}
:root[data-theme="dark"] .link{color:var(--coral)}

/* Scanner hero */
.scan-hero{padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;border-color:var(--coral-border)}
.finder{width:min(62vw,220px);aspect-ratio:1;max-width:100%;position:relative;display:grid;place-items:center;border-radius:14px;background:var(--coral-soft);margin-bottom:6px}
.finder .c{position:absolute;width:34px;height:34px;border:4px solid var(--coral);}
.finder .tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.finder .tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.finder .bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.finder .br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.finder svg.i{width:84px;height:84px;color:var(--coral);stroke-width:1.5}
.finder .line{position:absolute;left:14%;right:14%;height:3px;border-radius:2px;background:var(--coral);opacity:.75;top:20%;animation:sweep 2.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:78%}}
.scan-hero h2{font-size:23px;font-weight:700;line-height:1.25}
.scan-hero p{color:var(--muted-fg);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:17px;transition:background .15s,opacity .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--coral);color:var(--on-coral)}
.btn-primary:hover:not([disabled]){background:var(--coral-strong)}
.btn-xl{min-height:60px;font-size:18px;font-weight:700;width:100%;border-radius:14px}
.btn-xl svg.i{width:24px;height:24px}
.btn-outline{background:var(--card);border-color:var(--border-strong);color:var(--fg)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{background:transparent;color:var(--fg-2);border-color:var(--border)}
.btn-block{width:100%}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:4px;padding-top:16px;border-top:1px solid var(--border)}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg)}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--fg-2);font-size:13px;letter-spacing:0}
.step.on i{background:var(--coral);color:var(--on-coral)}
.step.done i{background:var(--ok-bg);color:var(--ok-fg)}
.step.on{color:var(--fg)}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{text-align:left;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border)}
.qa button:hover{border-color:var(--border-strong)}
.qa .ic{width:40px;height:40px;border-radius:10px;background:var(--muted);display:grid;place-items:center;color:var(--fg-2)}
.qa b{font-size:17px}
.qa span{font-size:14px;color:var(--muted-fg);line-height:1.35}

/* Alerts */
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid;align-items:flex-start}
.alert svg.i{margin-top:2px}
.alert b{display:block;font-weight:700}
.alert .sub{font-size:15px}
.a-ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.a-warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
.a-err{background:var(--err-bg);color:var(--err-fg);border-color:var(--err-bd)}
.a-pend{background:var(--pend-bg);color:var(--fg-2);border-color:var(--border)}
.alert .grow{flex:1;min-width:0}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)}
.p-err{background:var(--err-bg);color:var(--err-fg)}
.p-pend{background:var(--pend-bg);color:var(--pend-fg)}
.p-coral{background:var(--coral-soft);color:var(--coral-strong)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
.tag svg.i{width:14px;height:14px}

/* Activity list */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--border);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--muted);color:var(--fg-2);flex:none}
.row .main{flex:1;min-width:0}
.row .t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .t1 .mono{font-weight:600;font-size:16px}
.row .t2{font-size:15px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t3{font-size:13px;color:var(--muted-fg)}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted-fg);min-height:52px;justify-content:center;border-radius:12px;position:relative}
.nav button.on{color:var(--fg)}
.nav button.on::after{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:2px;background:var(--coral)}
.nav button.scan{background:var(--coral);color:var(--on-coral)}
.nav button.scan::after{display:none}
.nav .cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#1c1917;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* Focused flow top bar */
.topbar{display:flex;align-items:center;gap:10px;padding-top:14px}
.topbar h1{font-size:20px;font-weight:700;flex:1}
.mini-steps{display:flex;gap:4px}
.mini-steps span{width:22px;height:5px;border-radius:3px;background:var(--border-strong)}
.mini-steps span.done{background:var(--ok)}
.mini-steps span.on{background:var(--coral)}

/* Batch details */
.bd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.bd-head h2{font-size:18px;font-weight:700}
.bd-batch{padding:16px 20px 4px}
.bd-batch .lbl{font-size:14px;color:var(--muted-fg)}
.bd-batch .val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border);margin-top:12px}
.kv>div{background:var(--field-locked);padding:12px 20px;min-width:0}
.kv>div.full{grid-column:1/-1}
.kv .k{font-size:14px;color:var(--muted-fg);display:flex;gap:6px;align-items:center}
.kv .v{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.kv input,.kv select{width:100%;margin-top:4px;min-height:44px;border:1px solid var(--coral-border);border-radius:var(--r-sm);padding:0 10px;background:var(--card);font-size:16px}
.edited{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn-fg);background:var(--warn-bg);padding:1px 6px;border-radius:4px}
.bd-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;flex-wrap:wrap;border-top:1px solid var(--border)}
.bd-foot small{font-size:14px;color:var(--muted-fg)}
.btn-sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:10px}

/* User entry */
.entry{border-color:var(--coral-border)}
.entry .hd{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.field{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.field+.field{border-top:1px solid var(--border)}
.field>label,.field .flabel{font-size:17px;font-weight:700}
.qty{display:flex;gap:10px}
.qty input{flex:1;min-width:0;height:64px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:30px;font-weight:700;padding:0 16px;font-variant-numeric:tabular-nums}
.qty input:focus{border-color:var(--coral);outline:none;box-shadow:0 0 0 4px var(--coral-soft)}
.qty select{width:112px;height:64px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:18px;font-weight:600;padding:0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--border-strong);background:var(--card);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-strong)}
.hint{font-size:15px;color:var(--muted-fg)}
.hint b{color:var(--fg);font-weight:600}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{text-align:left;padding:14px;border-radius:var(--r);border:2px solid var(--border);background:var(--card);display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.type .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--muted);color:var(--fg-2)}
.type b{font-size:16px}
.type span{font-size:13px;color:var(--muted-fg);line-height:1.3}
.type.on{border-color:var(--coral);background:var(--coral-soft)}
.type.on .ic{background:var(--coral);color:var(--on-coral)}
.type .tick{position:absolute;top:12px;right:12px;color:var(--coral);display:none}
.type.on .tick{display:block}
.sel{width:100%;min-height:56px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:17px;font-weight:600;padding:0 14px}
.sel:focus{border-color:var(--coral);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--muted);border-radius:var(--r);padding:4px;gap:4px}
.seg button{min-height:46px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted-fg)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--coral);margin-top:1px;flex:none}

/* Validation */
.val-list{display:flex;flex-direction:column;gap:2px;padding:6px 8px 10px}
.vi{display:flex;gap:10px;padding:8px 12px;font-size:15px;align-items:flex-start;border-radius:8px}
.vi svg.i{margin-top:1px}
.vi.ok svg{color:var(--ok)} .vi.warn svg{color:var(--warn)} .vi.error{color:var(--err-fg);background:var(--err-bg)} .vi.error svg{color:var(--err)} .vi.pending{color:var(--muted-fg)}
.vi.warn{color:var(--fg)}
.val-head{padding:14px 16px;margin:10px 10px 4px}

/* Sticky action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:6px}
.actionbar .why{font-size:14px;color:var(--muted-fg);text-align:center}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);max-height:88vh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 14px}
.sheet h2{font-size:21px;font-weight:700}
.sheet .sub{color:var(--muted-fg);margin-top:4px}
.sum{margin:16px 0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.sum>div{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;border-top:1px solid var(--border);font-size:16px}
.sum>div:first-child{border-top:0}
.sum dt,.sum .k{color:var(--muted-fg)}
.sum .v{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.sheet-actions{display:flex;flex-direction:column;gap:10px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:84vh}}

/* Success */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 8px 8px}
.big-check{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:8px;animation:pop .45s cubic-bezier(.16,1,.3,1)}
.big-check.off{background:var(--warn-bg);color:var(--warn)}
.big-check svg.i{width:52px;height:52px;stroke-width:2.5}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.success h1{font-size:26px;font-weight:700}
.success .b{font-family:var(--mono);font-size:22px;font-weight:600}
.success .q{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.success .q small{font-size:22px;font-weight:600;color:var(--muted-fg)}
.txid{margin-top:14px;padding:14px 18px;border-radius:var(--r);border:1px dashed var(--border-strong);background:var(--field-locked);width:100%}
.txid .k{font-size:14px;color:var(--muted-fg)}
.txid .v{font-family:var(--mono);font-size:22px;font-weight:600}

/* Inventory */
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--card)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;min-height:48px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.filters .chip{flex:none;display:inline-flex;align-items:center;gap:6px}
.filters .chip small{font-size:13px;color:var(--muted-fg)}
.inv{display:grid;gap:12px}
.ic-card{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.ic-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ic-top .mono{font-size:19px;font-weight:600}
.ic-top .mill{font-size:15px;color:var(--fg-2)}
.ic-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-top:1px solid var(--border);padding-top:12px}
.ic-mid .qtyv{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ic-mid .qtyv small{font-size:16px;color:var(--muted-fg);font-weight:600}
.ic-mid .exp{text-align:right;font-size:14px;color:var(--muted-fg)}
.ic-mid .exp b{display:block;font-size:16px;color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate);border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border)}
.stats>div{background:var(--card);padding:14px}
.stats .k{font-size:13px;color:var(--muted-fg);line-height:1.3}
.stats .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.stats .v small{font-size:14px;color:var(--muted-fg);font-weight:600}
.empty{padding:32px 20px;text-align:center;color:var(--muted-fg)}

/* Scanner overlay */
.scanner{position:fixed;inset:0;z-index:60;background:var(--scan-bg);color:var(--scan-fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.sc-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:var(--scan-fg);display:grid;place-items:center}
.sc-btn.on{background:#fde68a;color:#1c1917}
.sc-title{font-weight:600;font-size:17px}
.sc-view{position:relative;z-index:1;flex:1;display:grid;place-items:center;min-height:0}
.sc-frame{width:min(72vw,300px);aspect-ratio:1;max-width:100%;position:relative;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.sc-frame .c{position:absolute;width:44px;height:44px;border:5px solid #fff}
.sc-frame .tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:18px}
.sc-frame .tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:18px}
.sc-frame .bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:18px}
.sc-frame .br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:18px}
.sc-frame .line{position:absolute;left:8%;right:8%;height:3px;border-radius:2px;background:var(--coral);box-shadow:0 0 12px var(--coral);top:12%;animation:sweep2 2s ease-in-out infinite alternate}
@keyframes sweep2{to{top:86%}}
.sc-frame.found .c{border-color:#4ade80}
.sc-frame.found .line{display:none}
.sc-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:15px;color:var(--scan-dim)}
.sc-msg svg.i{width:40px;height:40px;margin:0 auto 8px;display:block;opacity:.7}
.sc-ok{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.sc-ok>div{background:rgba(22,101,52,.92);color:#fff;border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:18px;animation:pop .35s cubic-bezier(.16,1,.3,1)}
.sc-ok svg.i{width:48px;height:48px;stroke-width:2.5}
.sc-bottom{position:relative;z-index:2;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0))}
.sc-bottom .inst{text-align:center;font-size:17px;font-weight:600}
.sc-bottom .note{text-align:center;font-size:14px;color:var(--scan-dim)}
.sc-bottom .btn-outline{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.sc-samples{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sc-samples button{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:600}
.sc-samples button span{font-family:var(--mono)}
.sc-samples .lab{align-self:center;font-size:13px;color:var(--scan-dim);flex:none;padding-right:2px}
.sc-err{background:rgba(220,38,38,.9);color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));z-index:70;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px);box-shadow:var(--sheet-shadow);animation:up .2s ease-out}
.toast.ok svg{color:#4ade80}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.switch b{display:block}
.switch small{color:var(--muted-fg);font-size:14px}
.tog{width:52px;height:32px;border-radius:16px;background:var(--border-strong);border:0;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--coral)}
.tog.on::after{left:23px}
.prof{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--coral-soft);color:var(--coral-strong);display:grid;place-items:center;font-weight:700;font-size:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:900px){
  .wrap{max-width:1040px}
  .home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
  .home-grid>div{display:flex;flex-direction:column;gap:20px}
  .verify-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:start}
  .verify-grid>div{display:flex;flex-direction:column;gap:20px}
  .inv{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .actionbar .wrap{max-width:560px;margin-left:auto;margin-right:max(16px,calc((100vw - 1040px)/2 + 16px))}
  .nav .wrap{max-width:560px}
}
@media (max-width:899px){.home-grid,.home-grid>div,.verify-grid,.verify-grid>div{display:flex;flex-direction:column;gap:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2 additions: label reading, sheet sync */
.sc-frame.label{width:min(80vw,330px);aspect-ratio:4/5}
.sc-prog{position:absolute;left:10%;right:10%;bottom:12%;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.sc-prog i{display:block;height:100%;background:var(--coral);transition:width .2s}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--coral);align-self:center;display:grid;place-items:center;color:#fff}
.shutter svg.i{width:30px;height:30px}
.sc-row{display:flex;gap:10px}
.sc-row .btn{flex:1;min-height:48px;font-size:15px;padding:0 10px}
.thumb{display:block;width:100%;max-height:220px;object-fit:contain;background:var(--muted);border-bottom:1px solid var(--border)}
.kv .v.missing{color:var(--warn-fg);font-weight:600;font-size:15px}
.kv .sub{font-size:13px;color:var(--muted-fg);font-weight:400}
.labcheck{padding:14px 20px;border-top:1px solid var(--border);background:var(--card)}
.inp{width:100%;min-height:52px;border-radius:var(--r);border:2px solid var(--border-strong);background:var(--card);font-size:16px;padding:0 14px}
.inp:focus{border-color:var(--coral);outline:none}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.form label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.form label small{font-weight:400;color:var(--muted-fg);font-size:13px}
.howto{margin-top:16px;border:1px solid var(--border);border-radius:var(--r);padding:4px 14px}
.howto summary{cursor:pointer;font-weight:600;padding:10px 0}
.howto ol{margin:0 0 12px;padding-left:20px;font-size:15px;color:var(--fg-2);display:flex;flex-direction:column;gap:6px}
.status-line{font-size:15px;margin-top:4px}
a.btn{text-decoration:none}
</style>
</head>

/* Sheet date text → ISO. Handles 22/01/2027, 1/7/2027, Dec-2026, June 2027, and real dates. Month-only values use the month's last day for expiry, first day for production. */
function sheetDate(v, end){

}

function toCanvas(src,w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(src,0,0,w,h); return c }
/* Find a coloured (yellow/white) label area and crop to it; falls back to the whole image. */
function cropLabel(src,w,h){

/* Rotate (clockwise degrees), scale long side to target, grayscale and stretch contrast. */

const KW=[/batch/i,/m[fi1l]\s*g\.?\s*da/i,/use\s*by|expiry|best\s*before/i,/net\s*w/i,/product/i,/premix/i,/l[i1]c\.?\s*n/i,/nutrient/i,/code/i];
const score = t => KW.reduce((s,r)=>s+(r.test(t)?1:0),0);

async function readLabel(src,w,h,progress){

 progress('Loading label reader…',0.05);
 let stage='';

 for(const r of [0,270,90,180]){
  stage = r===0?'Reading label…':'Checking label orientation…';
  await wk.setParameters({tessedit_pageseg_mode:'3'});
  const {data}=await wk.recognize(prep(base,r,1400)); const sc=score(data.text);

  {size:2200,psm:'6', rect:[0,0,0.46,1], need:x=>!have(x)},               // left column: batch, dates, net weight
  {size:2200,psm:'6', rect:[0,0,1,0.3], need:x=>!x.productName||!x.category||!x.code}, // heading
  {size:2200,psm:'6', rect:[0,0.15,0.55,0.45], need:x=>!have(x)},
  {size:2200,psm:'6', rect:[0.34,0,0.66,0.6], need:x=>!nutr(x)},          // nutrient table
  {size:1800,psm:'6', need:x=>!have(x)||!x.productName},
  {size:2200,psm:'11', rect:[0.34,0,0.66,0.6], need:x=>!nutr(x)},

function rotThumb(base,rot){ const w=base.width,h=base.height,sc=640/Math.max(w,h),W=Math.round(w*sc),H=Math.round(h*sc),swap=rot===90||rot===270;

/* ---------- Label text parser ---------- */
const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function parseDate(s, endOfMonth){
 if(!s) return '';
 const t=s.toUpperCase();
 const y4 = y => { y=String(y).replace(/O/g,'0'); let n=Number(y); if(y.length===2) n=2000+n; return n };
 const mk=(d,m,y)=>{ if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>=2015&&y<=2045)) return ''; const dt=new Date(y,m-1,d); if(dt.getMonth()!==m-1) return ''; return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` };
 let m = t.match(/([0-3]?[0-9O])\s*[\/\-. ]?\s*(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\s*[\/\-. ]?\s*((?:20)?[0-9O]{2})\b/);
 if(m) return mk(Number(m[1].replace(/O/g,'0')), MONS.indexOf(m[2])+1, y4(m[3]));
 m = t.match(/\b([0-3]?\d)\s*[\/\-.]\s*([01]?\d)\s*[\/\-.]\s*((?:20)?\d{2})\b/);
 if(m) return mk(Number(m[1]), Number(m[2]), y4(m[3]));
 m = t.match(/(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\s*[\/\-. ]?\s*((?:20)?\d{2})\b/);
 if(m){ const mo=MONS.indexOf(m[1])+1, y=y4(m[2]); return mk(endOfMonth?new Date(y,mo,0).getDate():1, mo, y) }

}
function after(text, re, len){ const m=text.match(re); if(!m) return ''; const i=m.index+m[0].length; return text.slice(i, i+(len||40)) }
function fixBatch(b){
 b=b.toUpperCase().replace(/[^A-Z0-9]/g,'');
 const m=b.match(/^([A-Z]{2,4})([0-9OISLB]{4,7})$/);
 if(m) b = m[1] + m[2].replace(/O/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/B/g,'8');
 return b;
}
const title = s => s.toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()).replace(/\bLtd\b/,'Ltd.').replace(/\.\.$/,'.');
const numStr = s => s ? s.replace(',', '.') : '';
function parseLabel(text){
 const T = text.replace(/[|]/g,' ').replace(/[ \t]+/g,' ');
 const f={};
 const okB = b => /^[A-Z]{1,5}\d{4,8}[A-Z]?$/.test(b);
 for(const mm of T.matchAll(/Batch\s*N[o0]\.?\s*[:;.]?\s*([A-Z0-9]{5,14})/gi)){ const b=fixBatch(mm[1]); if(okB(b)){ f.batch=b; break } }

 let m;
 f.mfg = parseDate(after(T,/M[fi1l]\s*g\.?\s*(?:Da[a-z]*|Dt)\.?/i,30));
 f.exp = parseDate(after(T,/(?:Use\s*By|Best\s*Before|Expiry|Exp\.?)\s*(?:Date|Dt)?\.?/i,30), true);
 m = T.match(/Net\s*W[a-z]*\s*[:;._\-i ]*\s*(\d+(?:[.,]\d+)?)\s*(kg|kgs|gm|gms|g|grams?)\b/i);
 if(m){ const v=Number(numStr(m[1])), u=m[2].toLowerCase(); f.net = `${m[1]} ${u.startsWith('k')?'kg':'g'}`; f.pack = u.startsWith('k') ? v : v/1000 }
 m = T.match(/PRODUCT\s*C[O0]DE\s*[:;.]?\s*([A-Z0-9][A-Z0-9\-]{3,20})/i); if(m) f.code=m[1].toUpperCase();
 m = T.match(/Category\s*[:;.]?\s*([A-Za-z][A-Za-z ]{3,40})/i); if(m){ const c=m[1].trim().split(/\s{2,}|\n/)[0]; if(c.length>=8) f.category=c }
 m = T.match(/Version\s*N[o0]\.?\s*[:;.]?\s*(\d{1,3})/i); if(m) f.version=m[1];
 for(const mm of T.matchAll(/\b([A-Z]{4,}(?:-[A-Z0-9]{1,6}){1,3})\b/g)){ if(/\d/.test(mm[1]) && !/CODE|BATCH|LIC/.test(mm[1])){ f.productName=mm[1]; break } }
 m = T.match(/Rate\s*of\s*Addition\s*[:;.]?\s*(\d+(?:\.\d+)?)\s*(g|gm|kg)\s*(?:of\s*)?premix[\s\S]{0,12}?per\s*(\d[\d,]*)\s*(kg|MT)/i);
 if(m) f.rate = `${m[1]} ${m[2].toLowerCase().startsWith('k')?'kg':'g'} premix per ${m[3]} ${m[4].toUpperCase()==='MT'?'MT':'kg'} of product`;

 m = T.match(/B\s*[1l]\s*2[^0-9]{0,40}?(\d{1,2}[.,]\d{2,6})/i); if(m) f.b12=numStr(m[1]);
 m = T.match(/F[o0]l[a-z]*\s*Ac[a-z]*[^0-9]{0,40}?(\d{1,2}[.,]\d{1,5})/i); if(m) f.folic=numStr(m[1]);
 m = T.match(/(?:Marketed|Manufactured|Mfd\.?)\s*By\s*[:;.]?\s*([A-Z][A-Za-z .&]{3,60}?(?:LTD|LIMITED|LLP|PVT\.? ?LTD)\.?)/i); if(m) f.vendor=title(m[1].trim());
 m = T.match(/L[i1]c\.?\s*N[o0]\.?\s*[:;.]?\s*(\d[\d ]{12,16}\d)/i); if(m) f.lic=m[1].replace(/\s/g,'');
 if(!f.lic){ m=T.match(/\b(1\d{13})\b/); if(m) f.lic=m[1] }

}



/* Batch number candidates for vendors whose codes are not letters + digits (for example codes with slashes or leading zeros). */
function batchFromText(raw, parsed){
 const flat = normB(raw);
 // 1. A Premix testing sheet batch that appears anywhere in the label text
 const seen = new Map();
 rows().forEach(r=>{ const k=baseB(r.batch); if(k.length>=6 && flat.includes(k)) seen.set(r.batch, r) });
 if(seen.size){ const list=[...seen.values()]; const bases=new Set(list.map(r=>baseB(r.batch))); if(bases.size===1) return {batch:list[0].batch, cands:list} ; }
 // 2. Text after "Batch No"
 for(const mm of raw.matchAll(/Batch\s*(?:N[o0]|Number|Code)\.?\s*[:;.]?\s*([^\n]{3,40})/gi)){
  const cut = mm[1].split(/\s{2,}|Nutrients|Levels|M[fi]g|Date|Exp|Use\s*By/i)[0].trim().replace(/[|]/g,'');
  const hits=findBatch(cut); if(hits.length) return {batch:hits[0].batch, cands:hits};
 }
 if(parsed.batch){ const hits=findBatch(parsed.batch); return {batch:hits.length?hits[0].batch:parsed.batch, cands:hits} }
 for(const mm of raw.matchAll(/Batch\s*(?:N[o0]|Number|Code)\.?\s*[:;.]?\s*([A-Z0-9][A-Z0-9\/\-]{4,30})/gi)){ const c=mm[1].toUpperCase(); if((c.match(/\d/g)||[]).length>=3) return {batch:c, cands:[]} }
 return {batch:'', cands:[]};
}

/* ---------- Draft ---------- */
/* source: 'label' | 'qr' | 'manual' */
function newDraft(source, opts){
 opts=opts||{};
 const d = {source, scannedAt:Date.now(), vendor:'', batch:'', mfg:'', mfgMonthOnly:false, exp:'', expMonthOnly:false,
   label:opts.label||null, thumb:opts.thumb||null, note:opts.note||'', cands:opts.cands||[], row:null,
   checked: source!=='label', editing:false, qty:'', dupAck:false, orig:null};
 if(source==='manual'){ d.vendor=opts.vendor||''; if(opts.batch) applyRow(d, rows().find(r=>r.batch===opts.batch && (!opts.vendor || r.vendor===opts.vendor))) }
 else {
  const L=d.label||{};
  d.batch=L.batch||''; d.mfg=L.mfg||''; d.exp=L.exp||'';
  d.vendor = matchVendor(L.vendor) || L.vendor || '';
  const hits = d.cands.length ? d.cands : findBatch(d.batch);
  d.cands = hits;
  if(hits.length===1) linkRow(d, hits[0]);
 }
 d.orig = {vendor:d.vendor, batch:d.batch, mfg:d.mfg, exp:d.exp};
 return d;
}
function applyRow(d, r){
 d.row=r||null; if(!r){ d.batch=''; d.exp=''; d.mfg=''; return }
 d.vendor=r.vendor; d.batch=r.batch; d.exp=r.exp; d.expMonthOnly=r.expMonthOnly; d.mfg=r.prod; d.mfgMonthOnly=true;
}
/* Label read + sheet row: keep label dates, add sheet info for checks */
function linkRow(d, r){ d.row=r; d.batch=r.batch; if(!d.vendor || matchVendor(d.vendor)===r.vendor || !matchVendor(d.vendor)) d.vendor=r.vendor; if(!d.exp && r.exp){ d.exp=r.exp; d.expMonthOnly=r.expMonthOnly } }
const qtyNum = d => { const v=parseFloat(String(d.qty).replace(',','.')); return isFinite(v)?v:NaN };
function edits(d){ if(d.source==='manual' || !d.orig) return []; return ['vendor','batch','mfg','exp'].filter(k=>String(d[k]||'')!==String(d.orig[k]||'')) }

function validate(d){
 const out=[]; const add=(state,text)=>out.push({state,text});
 add(millOK(D.millCode)?'ok':'error', millOK(D.millCode)?`Mill code ${D.millCode}`:'Mill code missing. Go back and enter it.');
 if(d.source==='manual'){
  if(!d.vendor) add('pending','Select the premix vendor');
  if(!d.batch) add('pending','Select the batch code');
 } else {
  add('ok', d.source==='label'?'Details read from label text':'Batch read from QR code or barcode');
  if(!d.vendor) add('error','Vendor not read. Tap Edit Details to select it.');
  if(!d.batch) add('error','Batch code not read. Tap Edit Details to enter it.');
 }
 if(d.batch){
  if(d.row) add('ok','Batch found in the Premix testing sheet');
  else if(d.cands.length>1) add('pending','Select the lot that matches the label');
  else if(rows().length) add('warn','Batch not found in the Premix testing sheet. Check the code, or refresh batch data.');
  else add('warn','Batch data not loaded, so the batch could not be checked.');
 }
 if(d.row && d.vendor && d.row.vendor!==d.vendor) add('warn',`Vendor differs from the sheet (${d.row.vendor})`);
 if(d.row && d.row.ferrozine && !/^cleared$/i.test(d.row.ferrozine)) add('warn',`Ferrozine assay status in sheet: ${d.row.ferrozine}`);
 if(isoOK(d.exp)){
  const n=daysLeft(d.exp);
  if(isoOK(d.mfg) && !d.mfgMonthOnly && d.exp<=d.mfg) add('error','Expiry date is before the manufacturing date. Check the label.');
  if(n<0) add('warn',`Expired ${-n} days ago. Follow the expired premix procedure.`);
  else if(n<=NEAR_DAYS) add('warn',`Near expiry: ${n} days remaining`);
  else add('ok',`Within shelf life: ${n} days remaining`);
 } else if(d.batch) add(d.source==='manual'?'warn':'error', d.source==='manual'?'No expiry date in the sheet for this batch':'Expiry date not read. Tap Edit Details to enter it.');
 if(d.row && d.source!=='manual' && isoOK(d.exp) && isoOK(d.row.exp)){
  const same = d.row.expMonthOnly ? d.exp.slice(0,7)===d.row.exp.slice(0,7) : d.exp===d.row.exp;
  if(!same) add('warn',`Label expiry (${fmtD(d.exp)}) differs from the sheet (${expTxt(d.row.exp,d.row.expMonthOnly)})`);
 }
 if(d.source!=='manual' && !isoOK(d.mfg)) add('warn','Manufacturing date not read');
 if(d.source==='label' && !d.checked) add('pending','Confirm the details match the printed label');
 const q=qtyNum(d);
 if(d.qty==='') add('pending','Enter the premix available at the mill');
 else if(!isFinite(q) || q<0) add('error','Enter 0 or more kg');
 else if(!/^\d+([.,]\d{1,3})?$/.test(String(d.qty).trim())) add('error','Use up to 3 decimal places');
 else if(q>20000) add('error','Quantity looks too large. Check the value.');
 else add('ok',`Premix available: ${kg(q)} kg`);
 const e=edits(d); if(e.length) add('warn',`Details edited (${e.join(', ')}) · will be flagged for review`);
 let dup=null;
 if(d.batch && isFinite(q)) dup = D.recs.find(r=>r.mill===D.millCode && normB(r.batch)===normB(d.batch) && Math.abs(r.qty-q)<1e-9 && Date.now()-r.ts<15*60e3);
 if(dup) add(d.dupAck?'warn':'error',`Possible duplicate of ${dup.id} recorded ${ago(dup.ts)}`);
 const errs=out.filter(o=>o.state==='error').length, pend=out.filter(o=>o.state==='pending').length, warns=out.filter(o=>o.state==='warn').length;
 return {items:out, errs, pend, warns, dup, ok:!errs&&!pend};
}

function valBox(v){

/* ================= SCANNER ================= */
const SC = {stream:null, torch:false, raf:null, busy:false, state:'idle', err:'', prog:0, msg:'', partial:null};
const labelMode = () => D.cfg.method==='label';
function scannerHTML(){
 const live = !!SC.stream && (SC.state==='live' || SC.state==='found' || SC.state==='reading');
 const lbl = labelMode(); const busy = SC.state==='reading';
 return `${SC.stream?'<video id="vid" playsinline muted></video>':''}

  <div class="sc-view"><div class="sc-frame ${lbl?'label':''} ${SC.state==='found'?'found':''}"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>${SC.state!=='found'&&(!lbl||busy)?'<span class="line"></span>':''}
   ${SC.state==='starting'?`<div class="sc-msg"><div>${I('camera')}Starting camera…</div></div>`:''}
   ${SC.state==='nocam'?`<div class="sc-msg"><div>${I('camera')}Live camera is not available here.<br>Take a photo of the label instead.</div></div>`:''}
   ${busy?`<div class="sc-msg"><div>${I(lbl?'text':'qr')}${esc(SC.msg||'Reading label…')}</div></div>${lbl?`<div class="sc-prog"><i style="width:${Math.round(SC.prog*100)}%"></i></div>`:''}`:''}
  </div>
  ${SC.state==='found'?`<div class="sc-ok" role="status"><div>${I('okc')}${lbl?'Label read successfully':'Code scanned successfully'}</div></div>`:''}</div>
  <div class="sc-bottom">
   ${SC.err?`<div class="sc-err" role="alert">${esc(SC.err)}</div>`:''}
   ${SC.partial?`<button class="btn btn-outline btn-block" data-s="partial">${I('pencil')}Enter details from this photo</button>`:''}
   <div class="inst">${lbl?'Fit the printed label inside the frame':'Align the batch QR code or barcode within the frame'}</div>
   ${lbl&&!busy&&SC.state!=='found'?'<div class="note">Hold steady, keep the text sharp and avoid glare. Sideways labels are fine.</div>':''}
   ${SC.state==='found'||busy?'':`
    ${lbl?(live?`<button class="shutter" data-s="capture" aria-label="Capture label">${I('camera')}</button>`:`<button class="btn btn-primary btn-block" data-s="photo">${I('camera')}Take Photo of Label</button>`):`<button class="btn ${live?'btn-outline':'btn-primary'} btn-block" data-s="photo">${I('image')}Take Photo of Code</button>`}
    <div class="sc-row"><button class="btn btn-outline" data-s="upload">${I('image')}Upload Photo</button>${lbl?`<button class="btn btn-outline" data-s="samplelabel">${I('text')}Try Sample Label</button>`:''}</div>
    <button class="link" data-s="manual" style="color:#fff;align-self:center">Label not readable? Select vendor and batch</button>`}
  </div>`;
}
function paintScanner(){ const el=document.getElementById('scanner'); el.innerHTML=scannerHTML(); if(SC.stream){ const v=document.getElementById('vid'); if(v){ v.srcObject=SC.stream; v.play().catch(()=>{}) } } }
async function openScanner(){
 if(needMill()) return;
 S.sheet=null; render();
 const el=document.getElementById('scanner'); el.hidden=false; document.body.style.overflow='hidden';
 SC.err=''; SC.partial=null; SC.torch=false; SC.state='starting'; paintScanner();
 if(labelMode()) loadTesseract().catch(()=>{});
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no api');
  SC.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
  if(el.hidden){ SC.stream.getTracks().forEach(t=>t.stop()); SC.stream=null; return }
  SC.state='live'; paintScanner(); if(!labelMode()) loopDecode();
 }catch(e){ SC.stream=null; SC.state='nocam'; paintScanner() }
}
function closeScanner(){
 cancelAnimationFrame(SC.raf); if(SC.stream){ SC.stream.getTracks().forEach(t=>t.stop()); SC.stream=null }
 SC.state='idle'; SC.partial=null; const el=document.getElementById('scanner'); el.hidden=true; el.innerHTML=''; document.body.style.overflow='';
}
const restState = () => SC.stream ? 'live' : 'nocam';
function setProg(msg,p){ SC.msg=msg; if(p!=null) SC.prog=Math.max(0,Math.min(1,p)); const pb=document.querySelector('.sc-prog i'); const mm=document.querySelector('.sc-msg div');
 if(pb && mm){ pb.style.width=Math.round(SC.prog*100)+'%'; mm.innerHTML=I('text')+esc(SC.msg) } else paintScanner() }
async function runLabel(src,w,h,isSample){
 SC.state='reading'; SC.err=''; SC.partial=null; SC.prog=0.02; SC.msg='Preparing photo…'; paintScanner();
 let res;
 try{ res = await readLabel(src,w,h,setProg) }
 catch(e){
  if(isSample) res={fields:parseLabel(SAMPLE_TEXT), raw:SAMPLE_TEXT, thumb:SAMPLE_IMG, note:'The label reader could not load here, so a stored reading of the sample label was used.'};
  else { SC.state=restState(); SC.err='The label reader could not load. It needs an internet connection the first time. Check the connection and try again.'; paintScanner(); return }
 }
 const bt = batchFromText(res.raw||'', res.fields);
 res.fields.batch = bt.batch; res.cands = bt.cands;
 if(!res.fields.batch){ SC.state=restState(); SC.err='Batch code not found on the label. Retake the photo, or enter the details yourself.'; SC.partial=res; paintScanner(); return }
 SC.state='found'; paintScanner(); try{ navigator.vibrate && navigator.vibrate(60) }catch(e){}
 setTimeout(()=>{ closeScanner(); openLabelDraft(res, 'label') }, 800);
}
function openLabelDraft(res, source){
 const f=res.fields||{};
 const d=newDraft(source, {label:{vendor:f.vendor||'', batch:f.batch||'', mfg:f.mfg||'', exp:f.exp||''}, thumb:res.thumb||null, note:res.note||'', cands:res.cands||[]});
 if(!d.batch) d.editing=true;
 S.draft=d; go('verify');
}
function captureFrame(){ const v=document.getElementById('vid'); if(!v || !v.videoWidth){ toast('Camera is still starting. Try again.'); return } const c=toCanvas(v,v.videoWidth,v.videoHeight); runLabel(c,c.width,c.height,false) }
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src }) }
async function runSample(){ try{ const im=await loadImg(SAMPLE_IMG); runLabel(im,im.naturalWidth,im.naturalHeight,true) }catch(e){ SC.err='Sample image could not load.'; paintScanner() } }

/* --- QR / barcode --- */
let detector=null;
async function getDetector(){ if(detector!==null) return detector; detector=false;
 try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); detector=new BarcodeDetector({formats:f.filter(x=>['qr_code','code_128','code_39','ean_13','data_matrix'].includes(x))}) } }catch(e){ detector=false }
 return detector }
async function decodeSource(src,w,h){
 const det=await getDetector();
 if(det){ try{ const r=await det.detect(src); if(r && r[0]) return r[0].rawValue }catch(e){} }
 if(window.jsQR){ const c=document.createElement('canvas'); const sc=Math.min(1,1000/Math.max(w,h)); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(src,0,0,c.width,c.height); const img=x.getImageData(0,0,c.width,c.height);
  const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'}); if(r) return r.data }
 return null;
}
function loopDecode(){
 let last=0;
 const tick=async ts=>{ if(SC.state!=='live' || labelMode()) return; const v=document.getElementById('vid');
  if(v && v.readyState>=2 && ts-last>280 && !SC.busy){ last=ts; SC.busy=true; const txt=await decodeSource(v,v.videoWidth,v.videoHeight); SC.busy=false; if(txt){ handleCode(txt); return } }
  SC.raf=requestAnimationFrame(tick) };
 SC.raf=requestAnimationFrame(tick);
}
function handleCode(text){
 const t=String(text).trim(); let o={};
 try{ const j=JSON.parse(t); if(j && typeof j==='object') o={batch:j.batch||j.batchNo, vendor:j.vendor, mfg:j.mfg, exp:j.exp} }catch(e){}
 if(!o.batch) t.split(/[;|\n]/).forEach(p=>{ const m=p.match(/^\s*([A-Za-z]+)\s*[=:]\s*(.+?)\s*$/); if(m) o[m[1].toLowerCase()]=m[2] });
 if(!o.batch) o.batch=t.length<=40?t:'';
 const hits=findBatch(o.batch||'');
 if(!o.batch){ SC.state=restState(); SC.err='This code does not contain a batch code.'; paintScanner(); if(SC.stream) loopDecode(); return }
 SC.err=''; SC.state='found'; paintScanner();
 setTimeout(()=>{ closeScanner(); openLabelDraft({fields:{batch:hits.length?hits[0].batch:o.batch, vendor:o.vendor||'', mfg:sheetDate(o.mfg).iso, exp:sheetDate(o.exp,true).iso}, cands:hits}, 'qr') }, 800);
}
async function toggleTorch(){
 const tr=SC.stream && SC.stream.getVideoTracks()[0];
 try{ const cap=tr && tr.getCapabilities ? tr.getCapabilities() : {}; if(!cap.torch) throw 0; SC.torch=!SC.torch; await tr.applyConstraints({advanced:[{torch:SC.torch}]}); paintScanner() }
 catch(e){ toast('Flashlight is not available on this device') }
}
async function onFile(e){
 const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
 if(document.getElementById('scanner').hidden){ const el=document.getElementById('scanner'); el.hidden=false; document.body.style.overflow='hidden'; SC.state='nocam' }
 try{
  const bmp = window.createImageBitmap ? await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f)) : await loadImg(URL.createObjectURL(f));
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  if(labelMode()){ runLabel(bmp,w,h,false); return }
  SC.state='reading'; SC.err=''; paintScanner();
  const txt=await decodeSource(bmp,w,h);
  if(txt) handleCode(txt); else { SC.state=restState(); SC.err='No QR code or barcode found. Retake the photo with the code filling the frame.'; paintScanner(); if(SC.stream) loopDecode() }
 }catch(err){ SC.state=restState(); SC.err='Could not open that photo. Try again.'; paintScanner() }
}
document.getElementById('photo').addEventListener('change', onFile);
document.getElementById('upload').addEventListener('change', onFile);
document.getElementById('scanner').addEventListener('click', e=>{
 const b=e.target.closest('[data-s]'); if(!b) return; const s=b.dataset.s;
 if(s==='close') closeScanner();
 else if(s==='torch') toggleTorch();
 else if(s==='photo') document.getElementById('photo').click();
 else if(s==='upload') document.getElementById('upload').click();
 else if(s==='capture') captureFrame();
 else if(s==='samplelabel') runSample();
 else if(s==='partial'){ const r=SC.partial; closeScanner(); openLabelDraft(r,'label') }
 else if(s==='manual'){ closeScanner(); startManual() }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(!document.getElementById('scanner').hidden) closeScanner(); else if(S.sheet){ S.sheet=null; render() } } });
function startManual(vendor,batch){ if(needMill()) return; S.draft=newDraft('manual',{vendor,batch}); go('verify'); if(!rows().length) toast('Batch data not loaded yet. Refresh batch data first.') }

/* ================= SUBMIT & GOOGLE SHEET ================= */
function submit(){
 const d=S.draft; const v=validate(d); if(!v.ok){ S.sheet=null; render(); return }
 const now=new Date(); const p=n=>String(n).padStart(2,'0');
 const id=`PA-${D.millCode.replace(/[^A-Z0-9]/g,'')}-${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}-${Math.random().toString(36).slice(2,5).toUpperCase()}`;
 const flags=v.items.filter(i=>i.state==='warn').map(i=>i.text).join(' | ');
 const r={id, ts:now.getTime(), mill:D.millCode, vendor:d.vendor, batch:d.batch, mfg:d.mfg, mfgMonthOnly:d.mfgMonthOnly, exp:d.exp, expMonthOnly:d.expMonthOnly,
  qty:Math.round(qtyNum(d)*1000)/1000, capture:d.source, inSheet:!!d.row, sheetExp:d.row?d.row.expText:'', ferrozine:d.row?d.row.ferrozine:'',
  label:d.label?`${d.label.vendor||''} | ${d.label.batch||''} | ${d.label.mfg||''} | ${d.label.exp||''}`:'', edited:edits(d).join(', '), flags,
  sync: D.cfg.url?'pending':'local'};
 D.recs.unshift(r); save();
 S.lastRec=r; S.draft=null; S.sheet=null; go('success');
 syncPending();
}
function recOut(r){
 const st=expState(r.exp);
 return {id:r.id, ts:new Date(r.ts).toISOString(), mill:r.mill, vendor:r.vendor, batch:r.batch,
  mfg:r.mfg||'', mfgMonthOnly:!!r.mfgMonthOnly, exp:r.exp||'', expMonthOnly:!!r.expMonthOnly, qty:r.qty,
  capture:{label:'Label scan',qr:'QR / barcode',manual:'Selected from list'}[r.capture]||'',
  inSheet:r.inSheet?'Yes':'No', expStatus:st==='expired'?'Expired':st==='near'?'Near expiry':st==='valid'?'Valid':'No expiry date',
  ferrozine:r.ferrozine||'', labelRead:r.label||'', edited:r.edited||'', flags:r.flags||''};
}
async function api(params, body){
 const u=D.cfg.url+(D.cfg.url.includes('?')?'&':'?')+new URLSearchParams(Object.assign({key:D.cfg.key||''},params)).toString();
 const r = body ? await fetch(D.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:D.cfg.key||''},body)),redirect:'follow'})
                : await fetch(u,{redirect:'follow'});
 const txt=await r.text(); let j; try{ j=JSON.parse(txt) }catch(e){ throw new Error('Unexpected reply from the script. Check the Web App URL and that access is set to Anyone.') }
 if(!j.ok) throw new Error(j.error||'The script reported an error');
 return j;
}
const netMsg = e => e.message==='Failed to fetch' ? 'could not reach Google. Check the connection and the Web App URL.' : e.message;
async function syncPending(){
 if(!D.cfg.url || !online() || S.syncing) return;
 D.recs.forEach(r=>{ if(r.sync==='local') r.sync='pending' });
 const q=pending(); if(!q.length){ render(); return }
 S.syncing=true; render();
 try{
  const j=await api(null,{action:'sync', records:q.map(recOut)});
  const saved=new Set(j.saved||q.map(r=>r.id));
  D.recs.forEach(r=>{ if(saved.has(r.id)) r.sync='synced' });
  D.lastSync=Date.now(); D.lastErr=''; save();
  toast(q.length===1?'Record saved to Google Sheet':`${q.length} records synced to Google Sheet`, true);
 }catch(e){ D.lastErr=netMsg(e); save(); toast('Sync failed. Records are kept on this device.') }
 S.syncing=false; render();
}
async function refreshPremix(manual){
 if(!D.cfg.url){ if(manual){ S.cfgMsg=null; S.sheet='sheetcfg'; render() } return }
 if(!online()){ if(manual) toast('You are offline. Batch data will refresh when the connection returns.'); return }
 if(S.refreshing) return;
 S.refreshing=true; if(manual||S.view!=='verify') render();
 try{
  const j=await api({action:'premix'});
  const list=(j.rows||[]).map(normRow).filter(r=>r.batch);
  D.premix={rows:list, fetchedAt:Date.now(), source:'sheet'}; D.lastRefreshErr=''; save();
  if(manual) toast(`${list.length} batches loaded from the Premix testing sheet`, true);
 }catch(e){ D.lastRefreshErr=netMsg(e); save(); if(manual) toast('Refresh failed. Using the last saved batch data.') }
 S.refreshing=false; if(S.view!=='verify') render();
}
function autoRefresh(){ if(D.cfg.autoRefresh && D.cfg.url && online() && (!D.premix.fetchedAt || Date.now()-D.premix.fetchedAt > REFRESH_MIN*60e3 - 5000)) refreshPremix(false) }
async function testConn(){
 const url=(document.getElementById('cfg-url').value||'').trim(), key=(document.getElementById('cfg-key').value||'').trim();
 if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){ S.cfgMsg={ok:false,title:'Enter the Apps Script Web App URL',sub:'It starts with https://script.google.com/macros/s/ and ends with /exec.'}; renderSheet(); return }
 S.cfgMsg={busy:true,title:'Testing connection…'}; renderSheet();
 try{
  const r=await fetch(url+(url.includes('?')?'&':'?')+'action=ping&key='+encodeURIComponent(key),{redirect:'follow'}); const j=await r.json();
  if(!j.ok) throw new Error(j.error||'The script reported an error');
  S.cfgMsg={ok:true,title:`Connected to "${j.name||'Google Sheet'}"`,sub:j.source?`Batch data: ${j.source.rows} rows in "${j.source.tab}". Tap Save.`:'Tap Save to start.'};
  const lk=document.getElementById('cfg-link'); if(lk && !lk.value && j.url) lk.value=j.url;
 }catch(e){ S.cfgMsg={ok:false,title:'Could not connect',sub:e.message==='Failed to fetch'?'Check the URL, that the deployment access is set to Anyone, and the internet connection.':e.message} }
 renderSheet();
}
window.addEventListener('online', ()=>{ render(); syncPending(); autoRefresh() });
window.addEventListener('offline', ()=>render());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') autoRefresh() });
setInterval(autoRefresh, 60e3);

/* ================= EVENTS ================= */
function saveMill(){
 const el=document.getElementById('millcode'); const v=(el?el.value:'').trim().toUpperCase().replace(/\s+/g,'');
 if(!millOK(v)){ const h=document.getElementById('millhint'); if(h){ h.textContent='Enter a valid mill code: 2 to 20 letters or numbers ( -, _ and / allowed ).'; h.style.color='var(--err-fg)' } if(el) el.focus(); return }
 D.millCode=v; S.millEdit=false; save(); render(); toast('Mill code saved: '+v, true);
}
document.addEventListener('click', e=>{
 const el=e.target.closest('[data-a]'); if(!el) return;
 const a=el.dataset.a, d=S.draft;
 if(a==='scrim'){ if(e.target===el){ S.sheet=null; render() } return }
 if(['dupack','labok','bvendor'].includes(a)) return;
 switch(a){
  case 'go': go(el.dataset.v); break;
  case 'scan': openScanner(); break;
  case 'manual': startManual(); break;
  case 'pickrow': startManual(el.dataset.v, el.dataset.b); break;
  case 'tomanual': { const v=d.vendor; S.draft=newDraft('manual',{vendor:vendors().includes(v)?v:''}); render(); break; }
  case 'millsave': saveMill(); break;
  case 'millchange': S.millEdit=true; render(); setTimeout(()=>{ const m=document.getElementById('millcode'); if(m){ m.focus(); m.select() } },30); break;
  case 'settings': S.sheet='settings'; render(); break;
  case 'sheetcfg': S.cfgMsg=null; S.sheet='sheetcfg'; render(); break;
  case 'close': S.sheet=null; render(); break;
  case 'cancel': S.draft=null; go('home'); break;
  case 'edit': d.editing=!d.editing; render(); break;
  case 'lot': linkRow(d, d.cands[+el.dataset.i]); render(); break;
  case 'review': if(validate(d).ok){ S.sheet='confirm'; render() } break;
  case 'submit': submit(); break;
  case 'rec': S.detail=el.dataset.id; S.sheet='rec'; render(); break;
  case 'bf': S.bFilter=el.dataset.f; render(); break;
  case 'rf': S.recFilter=el.dataset.f; render(); break;
  case 'refresh': refreshPremix(true); break;
  case 'method': D.cfg.method=el.dataset.m; save(); render(); break;
  case 'autoref': D.cfg.autoRefresh=!D.cfg.autoRefresh; save(); render(); autoRefresh(); break;
  case 'offline': D.simOffline=!D.simOffline; save(); render(); if(!D.simOffline) setTimeout(()=>{ syncPending(); autoRefresh() },300); break;
  case 'syncnow': S.sheet=null; D.lastErr=''; syncPending(); break;
  case 'clearsynced': { const n=D.recs.filter(r=>r.sync==='synced').length; D.recs=D.recs.filter(r=>r.sync!=='synced'); save(); render(); toast(n?`${n} synced record${n>1?'s':''} cleared from this phone`:'No synced records to clear'); break; }
  case 'cfgtest': testConn(); break;
  case 'cfgsave': {
   const url=(document.getElementById('cfg-url').value||'').trim(), link=(document.getElementById('cfg-link').value||'').trim(), key=(document.getElementById('cfg-key').value||'').trim();
   if(url && !/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){ S.cfgMsg={ok:false,title:'Enter the Apps Script Web App URL',sub:'It starts with https://script.google.com/macros/s/ and ends with /exec.'}; renderSheet(); break }
   if(link && !/^https:\/\//.test(link)){ S.cfgMsg={ok:false,title:'The sheet link must start with https://'}; renderSheet(); break }
   D.cfg.url=url; D.cfg.link=link; D.cfg.key=key; D.lastErr=''; save(); S.sheet=null; render();
   toast(url?'Google Sheet connected':'Settings saved', true); if(url){ refreshPremix(true); syncPending() } break; }
  case 'cfgclear': D.cfg.url=''; D.cfg.key=''; save(); S.cfgMsg=null; S.sheet=null; render(); toast('Google Sheet disconnected'); break;
 }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='millcode'){ e.preventDefault(); saveMill() } });
document.addEventListener('input', e=>{
 const t=e.target, d=S.draft;
 if(t.id==='millcode'){ const p=t.selectionStart; t.value=t.value.toUpperCase(); try{t.setSelectionRange(p,p)}catch(_){} }
 else if(t.id==='qty' && d){ const c=t.value.replace(/[^\d.,]/g,''); if(c!==t.value) t.value=c; d.qty=c; d.dupAck=false; refreshVerify() }
 else if(t.id==='bq'){ S.bQ=t.value; const pos=t.selectionStart; render(); const n=document.getElementById('bq'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){} } }
 else if(t.dataset.edit && d && t.tagName==='INPUT' && t.type!=='date'){
  const k=t.dataset.edit; d[k]= k==='batch' ? t.value.toUpperCase() : t.value;
  if(k==='batch'){ const hits=findBatch(d.batch); d.cands=hits; d.row = hits.length===1 ? hits[0] : null }
  refreshVerify();
 }
});
document.addEventListener('change', e=>{
 const t=e.target, d=S.draft;
 if(t.dataset.set && d){
  if(t.dataset.set==='vendor'){ d.vendor=t.value; applyRow(d,null) }
  else if(t.dataset.set==='batch'){ applyRow(d, rows().find(r=>r.batch===t.value && r.vendor===d.vendor)) }
  render();
 }
 else if(t.dataset.edit && d){ const k=t.dataset.edit; if(t.type==='date'){ d[k]=t.value; if(k==='exp') d.expMonthOnly=false; if(k==='mfg') d.mfgMonthOnly=false } else if(t.tagName==='SELECT'){ d[k]=t.value } const y=window.scrollY; render(); window.scrollTo(0,y) }
 else if(t.dataset.a==='dupack'){ d.dupAck=t.checked; refreshVerify() }
 else if(t.dataset.a==='labok'){ d.checked=t.checked; refreshVerify() }
 else if(t.dataset.a==='bvendor'){ S.bVendor=t.value; render() }
});

if(!D.premix.rows.length && SNAPSHOT && SNAPSHOT.rows && SNAPSHOT.rows.length && !D.cfg.url){ D.premix = {rows:SNAPSHOT.rows.map(normRow), fetchedAt:SNAPSHOT.fetchedAt, source:'snapshot'} }
render();
setTimeout(()=>{ autoRefresh(); syncPending() }, 600);
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
